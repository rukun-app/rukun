# Internal Docker listener: only the signed Midtrans notification endpoint is public.
server {
    listen 18085;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    location = /api/payments/webhooks/midtrans {
        limit_except POST { deny all; }
        include fastcgi_params;
        fastcgi_pass php85:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/p85/rukun/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_HOST rukun.p85.test;
        fastcgi_param SERVER_NAME rukun.p85.test;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_ACCEPT application/json;
    }

    location / { return 404; }
}
